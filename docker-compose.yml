
name: ti4601-proyecto2

services:
  mongo-1:
    image: mongo:8.0.4
    container_name: proyecto2-mongo-1
    hostname: mongo-1

    command:
      - mongod
      - --replSet
      - rs-plataforma
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"

    volumes:
      - mongo1_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

    networks:
      - plataforma-net

volumes:
  mongo1_data:

networks:
  plataforma-net:
    driver: bridge

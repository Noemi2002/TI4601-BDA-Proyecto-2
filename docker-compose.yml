
name: ti4601-proyecto2

services:

  # nodo 1
  mongo-1:
    image: mongo:8.0.4
    container_name: proyecto2-mongo-1
    hostname: mongo-1

    command:
      - mongod
      - --replSet
      - rs-plataforma
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"

    volumes:
      - mongo1_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

    networks:
      - plataforma-net



  # nodo 2
  mongo-2:
    image: mongo:8.0.4
    container_name: proyecto2-mongo-2
    hostname: mongo-2

    command:
      - mongod
      - --replSet
      - rs-plataforma
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"

    volumes:
      - mongo2_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

    networks:
      - plataforma-net


  # nodo 3
  mongo-3:
    image: mongo:8.0.4
    container_name: proyecto2-mongo-3
    hostname: mongo-3

    command:
      - mongod
      - --replSet
      - rs-plataforma
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"

    volumes:
      - mongo3_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 20

    networks:
      - plataforma-net

  carga:
    build:
      context: ./dataset
    profiles: ["herramientas"]
    working_dir: /app
    environment:
      MONGO_URI: mongodb://mongo-1:27017,mongo-2:27017,mongo-3:27017/?replicaSet=rs-plataforma
    volumes:
      - .:/app
    networks:
      - plataforma-net

      
volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  plataforma-net:
    driver: bridge

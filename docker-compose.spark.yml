services:
  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: proyecto2-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:8080:8080"   # UI del master: solo localhost (interfaz de administracion)
    volumes:
      - ./datalake:/datalake
      - ./spark/jobs:/opt/spark/jobs
      - ./datos:/datos:ro
    networks:
      - plataforma-net

  spark-worker-1:
    image: apache/spark:3.5.3-python3
    container_name: proyecto2-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    volumes:
      - ./datalake:/datalake
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - plataforma-net

  # Para la prueba con dos trabajadores: se levanta solo cuando lo necesites
  spark-worker-2:
    image: apache/spark:3.5.3-python3
    container_name: proyecto2-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    volumes:
      - ./datalake:/datalake
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - plataforma-net
    profiles: ["dos-workers"]

  # Servicio de Historial (receptor de POST /eventos). Sin puertos publicados.
  historial:
    build: ./servicios/historial
    container_name: proyecto2-historial
    environment:
      
      LAGO_DIR: /datalake/eventos
    volumes:
      - ./datalake:/datalake
    networks:
      - plataforma-net

  # Servicio de Analitica (GET /consultas/{q1..q5}). Sin puertos publicados: solo el
  # Gateway lo consulta. Lee el datalake en SOLO LECTURA y no tiene acceso a MongoDB.
  # Su driver de Spark corre aqui; los executors se conectan de vuelta por 7078/7079.
  analitica:
    build: ./servicios/analitica
    container_name: proyecto2-analitica
    environment:
      SPARK_MASTER: spark://spark-master:7077
      SPARK_DRIVER_HOST: analitica
      SPARK_CORES_MAX: "2"
    depends_on:
      - spark-master
    volumes:
      - ./datalake:/datalake:ro
      - ./spark/jobs:/opt/spark/jobs:ro
    networks:
      - plataforma-net

networks:
  plataforma-net:
    external: true
    name: ti4601-proyecto2_plataforma-net
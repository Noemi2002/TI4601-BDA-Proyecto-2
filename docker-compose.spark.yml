services:
  spark-master:
    image: apache/spark:3.5.3-python3
    container_name: proyecto2-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"   # UI del master
    volumes:
      - ./datalake:/datalake
      - ./spark/jobs:/opt/spark/jobs
      - ./datos:/datos:ro
    networks:
      - plataforma-net

  spark-worker-1:
    image: apache/spark:3.5.3-python3
    container_name: proyecto2-spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    volumes:
      - ./datalake:/datalake
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - plataforma-net

  # Para la prueba con dos trabajadores: se levanta solo cuando lo necesites
  spark-worker-2:
    image: apache/spark:3.5.3-python3
    container_name: proyecto2-spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    depends_on:
      - spark-master
    volumes:
      - ./datalake:/datalake
      - ./spark/jobs:/opt/spark/jobs
    networks:
      - plataforma-net
    profiles: ["dos-workers"]

networks:
  plataforma-net:
    external: true
    name: ti4601-proyecto2_plataforma-net